<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <style>
    /* Animated floating particles */
    @keyframes float1 {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-15px); opacity: 0.7; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-20px); opacity: 0.6; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .float-node-1 { animation: float1 6s ease-in-out infinite; }
    .float-node-2 { animation: float2 8s ease-in-out infinite; }
    .pulse-bg { animation: pulse 5s ease-in-out infinite; }

    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Background Glows (No filter dependency for universal SVG renderer support) -->
  <circle class="pulse-bg" cx="200" cy="100" r="180" fill="#6366f1" opacity="0.15" />
  <circle class="pulse-bg" cx="1000" cy="260" r="200" fill="#ec4899" opacity="0.12" />
  <circle class="pulse-bg" cx="600" cy="180" r="150" fill="#06b6d4" opacity="0.1" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic Knowledge Graph Nodes -->
  <g class="float-node-1">
    <circle cx="120" cy="80" r="6" fill="#8b5cf6" />
    <circle cx="120" cy="80" r="14" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5" />
    <line x1="120" y1="80" x2="220" y2="50" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  </g>

  <g class="float-node-2">
    <circle cx="1080" cy="100" r="8" fill="#ec4899" />
    <circle cx="1080" cy="100" r="18" stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.4" />
    <line x1="1080" y1="100" x2="980" y2="160" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />
  </g>

  <!-- Decorative Feature Pills (Right side) -->
  <g opacity="0.9">
    <!-- Pill 1: Local-First -->
    <rect x="860" y="65" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="885" cy="86" r="10" fill="#10b981" />
    <path d="M881 86 L884 89 L889 83" stroke="#ffffff" stroke-width="2" fill="none" />
    <text x="905" y="91" class="badge-text">Local-First &amp; Offline</text>

    <!-- Pill 2: Markdown & PKM -->
    <rect x="890" y="140" width="230" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="915" cy="161" r="10" fill="#6366f1" />
    <text x="911" y="165" font-family="monospace" font-weight="bold" font-size="12" fill="#ffffff">#</text>
    <text x="935" y="166" class="badge-text">Markdown &amp; Bi-Links</text>

    <!-- Pill 3: E2E Encryption -->
    <rect x="840" y="215" width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="865" cy="236" r="10" fill="#f59e0b" />
    <path d="M861 238 V234 A4 4 0 0 1 869 234 V238 M860 238 H870 V243 H860 Z" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <text x="885" y="241" class="badge-text">E2EE Security</text>
  </g>

  <!-- Central Foreground Content Box -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <rect x="0" y="55" width="250" height="30" rx="15" fill="url(#accent1)" opacity="0.9" />
    <text x="125" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">AWESOME ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text" font-size="44" letter-spacing="-0.5">
      Awesome Note-Taking
    </text>
    <text x="0" y="192" class="title-text" font-size="44" fill="url(#accent1)" letter-spacing="-0.5">
      &amp; PKM Software
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" class="subtitle-text" font-size="17">
      Curated directory of commercial apps, local-first markdown tools,
    </text>
    <text x="0" y="266" class="subtitle-text" font-size="17">
      and open-source knowledge management systems.
    </text>

    <!-- Bottom Highlights Row -->
    <g transform="translate(0, 295)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
        20+ Open-Source Projects &nbsp;|&nbsp; Commercial SaaS Pricing &nbsp;|&nbsp; Privacy &amp; Sync
      </text>
    </g>
  </g>
</svg>
