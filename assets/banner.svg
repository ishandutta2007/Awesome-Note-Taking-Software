<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f6ff"/>
      <stop offset="70%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Pill Gradients -->
    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pill-stroke-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pill-stroke-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pill-stroke-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="pill-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pill-stroke-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Text Readability -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-1.5deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 7px; opacity: 0.9; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(15px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(15px) rotate(-360deg); }
      }

      .bg-float-1 { animation: float1 7s ease-in-out infinite; }
      .bg-float-2 { animation: float2 9s ease-in-out infinite 1s; }
      .bg-float-3 { animation: float3 8s ease-in-out infinite 2s; }
      .glow-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 8 12; animation: flowDash 15s linear infinite; }
      .pulse-node-1 { animation: nodePulse 3s ease-in-out infinite; }
      .pulse-node-2 { animation: nodePulse 4s ease-in-out infinite 1.5s; }
      .pulse-node-3 { animation: nodePulse 3.5s ease-in-out infinite 0.7s; }
      
      /* Ensure text styling is crisp */
      .banner-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.2px;
      }
      .banner-badge {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- 1. BASE BACKGROUND LAYER -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Radial Ambient Glows -->
  <rect width="1200" height="420" fill="url(#glow-purple)" rx="16" class="glow-pulse"/>
  <rect width="1200" height="420" fill="url(#glow-blue)" rx="16"/>
  <circle cx="600" cy="210" r="300" fill="url(#glow-cyan)" class="glow-pulse"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300 M 0,360 L 1200,360" />
    <path d="M 100,0 L 100,420 M 200,0 L 200,420 M 300,0 L 300,420 M 400,0 L 400,420 M 500,0 L 500,420 M 600,0 L 600,420 M 700,0 L 700,420 M 800,0 L 800,420 M 900,0 L 900,420 M 1000,0 L 1000,420 M 1100,0 L 1100,420" />
  </g>

  <!-- 2. ANIMATED BACKGROUND GRAPH / NETWORK NODES & CARDS (BACKGROUND ONLY - LOW OPACITY/POSITIONED AWAY FROM TITLE CENTER) -->
  
  <!-- Network Graph Connections in Background -->
  <g stroke="#818cf8" opacity="0.25" stroke-width="1.5" class="animated-dash">
    <!-- Left Network Graph -->
    <path d="M 80,100 L 160,160 L 120,280 L 220,240 L 160,160 M 220,240 L 260,340 M 80,100 L 200,80" />
    <!-- Right Network Graph -->
    <path d="M 1120,110 L 1020,170 L 1080,290 L 970,230 L 1020,170 M 970,230 L 920,330 M 1120,110 L 1000,70" />
  </g>

  <!-- Animated Graph Nodes -->
  <g fill="#a78bfa">
    <!-- Left Nodes -->
    <circle cx="80" cy="100" r="4" class="pulse-node-1"/>
    <circle cx="160" cy="160" r="5" class="pulse-node-2"/>
    <circle cx="120" cy="280" r="4" class="pulse-node-3"/>
    <circle cx="220" cy="240" r="6" class="pulse-node-1"/>
    <circle cx="260" cy="340" r="4" class="pulse-node-2"/>
    <circle cx="200" cy="80" r="5" class="pulse-node-3"/>

    <!-- Right Nodes -->
    <circle cx="1120" cy="110" r="4" class="pulse-node-2"/>
    <circle cx="1020" cy="170" r="6" class="pulse-node-1"/>
    <circle cx="1080" cy="290" r="4" class="pulse-node-3"/>
    <circle cx="970" cy="230" r="5" class="pulse-node-2"/>
    <circle cx="920" cy="330" r="4" class="pulse-node-1"/>
    <circle cx="1000" cy="70" r="5" class="pulse-node-3"/>
  </g>

  <!-- Background Decorative Ambient Floating Cards (Shifted to Left & Right Wings) -->
  <!-- Left Decorative Dynamic Card -->
  <g class="bg-float-1" opacity="0.45">
    <rect x="50" y="140" width="130" height="75" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="65" y="155" width="60" height="6" rx="3" fill="#a78bfa" opacity="0.8"/>
    <rect x="65" y="170" width="90" height="5" rx="2.5" fill="#64748b" opacity="0.6"/>
    <rect x="65" y="182" width="75" height="5" rx="2.5" fill="#64748b" opacity="0.6"/>
    <circle cx="155" cy="158" r="4" fill="#34d399"/>
  </g>

  <!-- Right Decorative Dynamic Card -->
  <g class="bg-float-2" opacity="0.45">
    <rect x="1010" y="190" width="135" height="80" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="1025" y="205" width="70" height="6" rx="3" fill="#38bdf8" opacity="0.8"/>
    <rect x="1025" y="220" width="95" height="5" rx="2.5" fill="#64748b" opacity="0.6"/>
    <rect x="1025" y="232" width="60" height="5" rx="2.5" fill="#64748b" opacity="0.6"/>
    <circle cx="1120" cy="208" r="4" fill="#f43f5e"/>
  </g>

  <!-- 3. CENTER GLASS Backdrop PANEL FOR GUARANTEED FOREGROUND CONTRAST -->
  <rect x="230" y="45" width="740" height="330" rx="20" fill="#030712" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" filter="url(#shadow)"/>
  <rect x="231" y="46" width="738" height="328" rx="19" fill="none" stroke="url(#title-grad)" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- 4. FOREGROUND CONTENT LAYER (ALWAYS RENDERED IN FRONT) -->
  
  <!-- Icon / Top Emblem Badge -->
  <g filter="url(#shadow)">
    <!-- Outer Emblem Box -->
    <rect x="565" y="70" width="70" height="70" rx="18" fill="url(#pill-grad-1)" stroke="url(#pill-stroke-1)" stroke-width="1.5"/>
    <!-- Note / Book Icon -->
    <path d="M 586 86 C 586 86 594 84 600 88 C 606 84 614 86 614 86 L 614 118 C 614 118 606 116 600 120 C 594 116 586 118 586 118 Z" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 600 88 L 600 120" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M 591 96 L 595 95 M 591 103 L 595 102 M 605 95 L 609 96 M 605 102 L 609 103" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="185" text-anchor="middle" fill="url(#title-grad)" class="banner-title" filter="url(#shadow)">
    Awesome Note-Taking Software
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" fill="#94a3b8" class="banner-subtitle" filter="url(#shadow)">
    Curated PKM Ecosystem • Markdown • Local-First • E2EE • Zettelkasten
  </text>

  <!-- Decorative Separator Line -->
  <line x1="420" y1="248" x2="780" y2="248" stroke="url(#title-grad)" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>

  <!-- Dynamic Foreground Feature Pills (Strictly in foreground under title, cleanly laid out) -->
  <g filter="url(#shadow)">
    <!-- Pill 1: Markdown -->
    <g class="bg-float-1" transform="translate(265, 275)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="url(#pill-grad-1)" stroke="url(#pill-stroke-1)" stroke-width="1"/>
      <circle cx="17" cy="17" r="4" fill="#a78bfa"/>
      <text x="64" y="21" text-anchor="middle" fill="#e0e7ff" class="banner-badge">Markdown</text>
    </g>

    <!-- Pill 2: Local-First -->
    <g class="bg-float-3" transform="translate(398, 275)">
      <rect x="0" y="0" width="128" height="34" rx="17" fill="url(#pill-grad-2)" stroke="url(#pill-stroke-2)" stroke-width="1"/>
      <circle cx="17" cy="17" r="4" fill="#38bdf8"/>
      <text x="67" y="21" text-anchor="middle" fill="#e0f2fe" class="banner-badge">Local-First</text>
    </g>

    <!-- Pill 3: E2E Encryption -->
    <g class="bg-float-2" transform="translate(539, 275)">
      <rect x="0" y="0" width="125" height="34" rx="17" fill="url(#pill-grad-3)" stroke="url(#pill-stroke-3)" stroke-width="1"/>
      <circle cx="17" cy="17" r="4" fill="#34d399"/>
      <text x="66" y="21" text-anchor="middle" fill="#ecfdf5" class="banner-badge">E2EE Privacy</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g class="bg-float-1" transform="translate(677, 275)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pill-grad-4)" stroke="url(#pill-stroke-4)" stroke-width="1"/>
      <circle cx="17" cy="17" r="4" fill="#fbbf24"/>
      <text x="71" y="21" text-anchor="middle" fill="#fffbeb" class="banner-badge">Open Source</text>
    </g>

    <!-- Pill 5: Bi-Directional -->
    <g class="bg-float-3" transform="translate(824, 275)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="url(#pill-grad-1)" stroke="url(#pill-stroke-1)" stroke-width="1"/>
      <circle cx="17" cy="17" r="4" fill="#c084fc"/>
      <text x="60" y="21" text-anchor="middle" fill="#f3e8ff" class="banner-badge">Graph Sync</text>
    </g>
  </g>

  <!-- Bottom Accent Sparkle Highlights -->
  <g fill="#a78bfa" opacity="0.7" class="pulse-node-2">
    <path d="M 310 100 L 313 106 L 319 109 L 313 112 L 310 118 L 307 112 L 301 109 L 307 106 Z" />
    <path d="M 890 110 L 892 114 L 896 116 L 892 118 L 890 122 L 888 118 L 884 116 L 888 114 Z" />
  </g>

  <!-- Top Border Accent Line -->
  <rect x="350" y="45" width="500" height="2" fill="url(#title-grad)" opacity="0.6"/>
</svg>
